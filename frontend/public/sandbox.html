<!doctype html>
<html>
<body>
<script>
window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'eyf-run') return;
  var results = [], logs = [];
  console.log = function () {
    logs.push(Array.prototype.slice.call(arguments).map(String).join(' '));
  };
  try {
    eval(e.data.code); // eslint-disable-line no-eval
    parent.postMessage({ type: 'eyf-result', results: results, logs: logs }, '*');
  } catch (err) {
    parent.postMessage({ type: 'eyf-result', results: [], logs: logs, error: err.message }, '*');
  }
});
</script>
</body>
</html>
