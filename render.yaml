services:
  - type: web
    name: eyf-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix frontend ci && npx prisma generate && npm run build && npm run frontend:build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVE_FRONTEND
        value: true
      - key: TRUST_PROXY
        value: true
      - key: APP_NAME
        value: eyf-api
      - key: DATABASE_URL
        fromDatabase:
          name: eyf-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BILLING_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: JUDGE0_API_URL
        sync: false

databases:
  - name: eyf-db
    databaseName: eyf
    region: singapore
    plan: free
