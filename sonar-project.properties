# ─── SonarQube Cloud (sonarcloud.io) ──────────────────────────────
# projectKey / organization must match what SonarCloud shows for this repo
# (Administration → Update Key). Defaults assume the EngineerYourFuture org.
sonar.projectKey=EngineerYourFuture_EYF
sonar.organization=engineeryourfuture

sonar.projectName=Engineer Your Future
sonar.projectVersion=1.0

# Analyse app + package sources across the monorepo.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Keep generated, built, and vendored code out of analysis.
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/.turbo/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/generated/**,\
  packages/db/prisma/migrations/**,\
  apps/web/public/**,\
  apps/web/e2e/**,\
  .claude/**

# Test coverage — API unit tests (vitest → lcov). Covers TS too on current Sonar.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info

# Static data banks and the currently-untested web/mobile layers shouldn't
# distort the coverage metric. Remove these as real test coverage lands.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.config.ts,\
  apps/api/src/lib/*-bank.ts,\
  apps/web/**,\
  apps/mobile/**,\
  packages/**

sonar.sourceEncoding=UTF-8
