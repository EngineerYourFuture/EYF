# ─── SonarQube Cloud (sonarcloud.io) ──────────────────────────────
# projectKey / organization must match what SonarCloud shows for this repo
# (Administration → Update Key). Defaults assume the EngineerYourFuture org.
sonar.projectKey=EngineerYourFuture_EYF
sonar.organization=engineeryourfuture

sonar.projectName=Engineer Your Future
sonar.projectVersion=1.0

# Analyse app + package sources across the monorepo.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Keep generated, built, and vendored code out of analysis.
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.next-*/**,\
  **/dist/**,\
  apps/*/build/**,\
  packages/*/build/**,\
  **/.turbo/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/generated/**,\
  packages/db/prisma/migrations/**,\
  apps/web/public/**,\
  apps/web/e2e/**,\
  .claude/**

# The LMS route apps/web/app/(app)/orgs/[orgId]/build is application source.
# Only top-level package build outputs are excluded above.

# Test coverage — API + shared-logic (@eyf/types) unit tests (vitest → lcov).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,packages/types/coverage/lcov.info

# Static data banks and the currently-untested layers shouldn't distort the coverage
# metric. @eyf/types IS well-tested (its lcov is ingested above), so it's measured — only
# the genuinely-untested layers (web/mobile UI, the no-test db/ui/config packages) are
# excluded. Remove these as real test coverage lands.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.config.ts,\
  apps/api/src/lib/*-bank.ts,\
  apps/web/**,\
  apps/mobile/**,\
  packages/ui/**,\
  packages/db/**,\
  packages/config/**

sonar.sourceEncoding=UTF-8

# Restrict TypeScript program discovery to this workspace, excluding old scratch worktrees.
sonar.typescript.tsconfigPaths=apps/*/tsconfig.json,apps/web/e2e/tsconfig.json,packages/*/tsconfig.json
