name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Test + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eyf
          POSTGRES_PASSWORD: eyf
          POSTGRES_DB: eyf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eyf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prepare test DB (apply migrations — same path as production)
        run: pnpm --filter @eyf/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf
          DIRECT_DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf

      - name: Apply tenant-isolation RLS policies (prod parity)
        run: pnpm --filter @eyf/db db:rls
        env:
          DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf
          DIRECT_DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf

      - name: Test
        run: pnpm --filter @eyf/types test && pnpm --filter @eyf/api test
        env:
          DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf
          JWT_ACCESS_SECRET: ci-only-not-secret-32-character-key-pad
          JWT_REFRESH_SECRET: ci-only-not-secret-32-character-key-padx

      - name: Build
        run: pnpm build
        env:
          # Provide minimal envs so Next.js + API typecheck-able builds run.
          DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf
          JWT_ACCESS_SECRET: ci-only-not-secret-32-character-key-pad
          JWT_REFRESH_SECRET: ci-only-not-secret-32-character-key-padx
          NEXT_PUBLIC_API_URL: http://localhost:4000/v1
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
