name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Test + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @eyf/types test && pnpm --filter @eyf/api test

      - name: Build
        run: pnpm build
        env:
          # Provide minimal envs so Next.js + API typecheck-able builds run.
          DATABASE_URL: postgresql://eyf:eyf@localhost:5432/eyf
          JWT_ACCESS_SECRET: ci-only-not-secret-32-character-key-pad
          JWT_REFRESH_SECRET: ci-only-not-secret-32-character-key-padx
          NEXT_PUBLIC_API_URL: http://localhost:4000/v1
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
